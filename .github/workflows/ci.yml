name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-15
            platform: darwin
            arch: arm64
            executable: ./dist/lh
          - name: Windows x64
            runner: windows-2025
            platform: win32
            arch: x64
            executable: ./dist/lh.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify runner architecture
        run: >-
          bun -e "if (process.platform !== '${{ matrix.platform }}' ||
          process.arch !== '${{ matrix.arch }}') throw new Error('Expected
          ${{ matrix.platform }}/${{ matrix.arch }}, got ' + process.platform +
          '/' + process.arch)"

      - name: Check formatting, lint, types, and tests
        run: bun run check

      - name: Build native standalone executable
        run: bun run build

      - name: Verify macOS signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=2 ./dist/lh

      - name: Smoke test standalone executable
        run: ${{ matrix.executable }} --help

      - name: Test Windows source installer
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "localhub-install"
          & ./scripts/install.ps1 -InstallDir $installDir -SkipSetup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $installDir "lh.exe") --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $installDir "lh.exe") --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test macOS source installer
        if: runner.os == 'macOS'
        shell: bash
        env:
          LOCALHUB_INSTALL_DIR: ${{ runner.temp }}/localhub-install
        run: |
          ./scripts/install.sh
          "$LOCALHUB_INSTALL_DIR/lh" --version
          "$LOCALHUB_INSTALL_DIR/lh" --help
