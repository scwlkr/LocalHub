name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-15
            platform: darwin
            arch: arm64
            executable: ./dist/lh
          - name: Windows x64
            runner: windows-2025
            platform: win32
            arch: x64
            executable: ./dist/lh.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify runner architecture
        run: >-
          bun -e "if (process.platform !== '${{ matrix.platform }}' ||
          process.arch !== '${{ matrix.arch }}') throw new Error('Expected
          ${{ matrix.platform }}/${{ matrix.arch }}, got ' + process.platform +
          '/' + process.arch)"

      - name: Check formatting, lint, types, and tests
        run: bun run check

      - name: Build native standalone executable
        run: bun run build

      - name: Verify macOS signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=2 ./dist/lh

      - name: Smoke test standalone executable
        run: ${{ matrix.executable }} --help

      - name: Acquire exact zero-cost llama.cpp runtime
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist/vendor
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output dist/vendor/llama-b10107-bin-macos-arm64.tar.gz \
            https://github.com/ggml-org/llama.cpp/releases/download/b10107/llama-b10107-bin-macos-arm64.tar.gz
          actual="$(shasum -a 256 dist/vendor/llama-b10107-bin-macos-arm64.tar.gz | awk '{print $1}')"
          expected="b9554ab4c9f6e91199f48387cb4ab27466fb1d724881f81463ef03f6370cfa32"
          test "$actual" = "$expected"

      - name: Assemble exact macOS candidate
        if: runner.os == 'macOS'
        run: bun run candidate:assemble

      - name: Drive candidate through shipped commands
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bun run candidate:smoke \
            dist/candidates/*/release-candidate.json \
            dist/evidence/t01-assembled-release.json
          dist/candidates/*/lh evidence validate \
            dist/candidates/*/release-candidate.json \
            dist/evidence/t01-assembled-release.json

      - name: Drive supervised LocalHub Run lifecycle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bun run candidate:lifecycle \
            dist/candidates/*/release-candidate.json \
            dist/evidence/t02-supervised-run.json
          dist/candidates/*/lh evidence validate \
            dist/candidates/*/release-candidate.json \
            dist/evidence/t02-supervised-run.json

      - name: Retain candidate and sanitized evidence
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: localhub-macos-arm64-${{ github.sha }}
          path: |
            dist/candidates/
            dist/evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Test Windows source installer
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "localhub-install"
          & ./scripts/install.ps1 -InstallDir $installDir -SkipSetup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $installDir "lh.exe") --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $installDir "lh.exe") --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test macOS source installer
        if: runner.os == 'macOS'
        shell: bash
        env:
          LOCALHUB_INSTALL_DIR: ${{ runner.temp }}/localhub-install
        run: |
          ./scripts/install.sh
          "$LOCALHUB_INSTALL_DIR/lh" --version
          "$LOCALHUB_INSTALL_DIR/lh" --help
