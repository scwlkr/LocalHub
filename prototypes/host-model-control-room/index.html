<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocalHub Host Control Room — Prototype</title>
    <style>
      /*
       * PROTOTYPE ONLY. Three variants of the Host model control room,
       * switchable via ?variant=, on a standalone local prototype route.
       */
      :root {
        color-scheme: dark;
        --ink: #eef0e8;
        --muted: #9ba39a;
        --line: rgba(238, 240, 232, 0.13);
        --panel: rgba(21, 25, 23, 0.92);
        --green: #b7f36b;
        --mint: #79edc2;
        --amber: #ffc66d;
        --red: #ff8077;
        --blue: #83b8ff;
        --bg: #0a0d0c;
        --display: ui-serif, Georgia, serif;
        --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      }

      * { box-sizing: border-box; }
      html { background: var(--bg); }
      body { margin: 0; min-height: 100vh; color: var(--ink); background: var(--bg); font-family: var(--sans); }
      button, input, select { font: inherit; }
      button { color: inherit; }
      button:focus-visible, a:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

      .prototype-flag {
        position: fixed; z-index: 100; top: 16px; right: 18px; padding: 7px 10px;
        border: 1px solid rgba(255,255,255,.16); border-radius: 999px; background: rgba(7,9,8,.78);
        backdrop-filter: blur(14px); color: #cbd0c7; font: 700 10px/1 var(--mono); letter-spacing: .12em;
      }

      .switcher {
        position: fixed; z-index: 200; left: 50%; bottom: 20px; transform: translateX(-50%);
        display: flex; align-items: center; gap: 5px; padding: 5px; min-width: 350px;
        border: 1px solid rgba(255,255,255,.16); border-radius: 18px; background: rgba(4,6,5,.92);
        box-shadow: 0 22px 60px rgba(0,0,0,.55); backdrop-filter: blur(18px);
      }
      .switcher button { border: 0; background: transparent; cursor: pointer; border-radius: 13px; }
      .switcher .arrow { width: 42px; height: 42px; color: #cbd0c7; font-size: 18px; }
      .switcher .arrow:hover { background: #1a1e1b; color: white; }
      .switcher .variant-label { flex: 1; display: grid; place-items: center; min-height: 42px; text-align: center; }
      .switcher strong { font-size: 12px; }
      .switcher small { color: var(--muted); font-size: 10px; margin-top: 2px; }

      .toast {
        position: fixed; z-index: 300; right: 22px; bottom: 88px; max-width: 390px; padding: 14px 16px;
        border: 1px solid rgba(183,243,107,.35); border-radius: 13px; background: #172015; color: #e8f7d7;
        box-shadow: 0 16px 44px rgba(0,0,0,.4); transform: translateY(12px); opacity: 0; pointer-events: none;
        transition: .2s ease; font-size: 13px;
      }
      .toast.show { transform: translateY(0); opacity: 1; }

      .eyebrow { color: var(--green); font: 700 10px/1.2 var(--mono); letter-spacing: .14em; text-transform: uppercase; }
      .muted { color: var(--muted); }
      .mono { font-family: var(--mono); }
      .tiny { font-size: 11px; }
      .status { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 750; }
      .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 4px color-mix(in srgb, currentColor 13%, transparent); }
      .ok { color: var(--mint); }
      .warn { color: var(--amber); }
      .bad { color: var(--red); }
      .info { color: var(--blue); }
      .pill { display: inline-flex; align-items: center; min-height: 25px; padding: 0 9px; border: 1px solid var(--line); border-radius: 999px; color: #cbd1ca; font: 650 10px/1 var(--mono); }
      .pill.accent { background: rgba(183,243,107,.1); border-color: rgba(183,243,107,.24); color: var(--green); }
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; padding: 0 13px; border: 1px solid var(--line); border-radius: 9px; background: #1a1e1b; cursor: pointer; font-size: 12px; font-weight: 750; }
      .btn:hover { border-color: rgba(255,255,255,.28); background: #202520; }
      .btn.primary { background: var(--green); color: #10160b; border-color: var(--green); }
      .btn.danger { color: #ffb1a9; border-color: rgba(255,128,119,.28); background: rgba(255,128,119,.07); }
      .btn.ghost { background: transparent; }
      .btn.small { min-height: 29px; padding: 0 9px; font-size: 10px; }
      .meter { height: 6px; overflow: hidden; border-radius: 99px; background: rgba(255,255,255,.08); }
      .meter > i { display: block; height: 100%; width: var(--value); border-radius: inherit; background: var(--meter-color, var(--green)); }
      .command { padding: 12px 14px; overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: #090b0a; color: #c6d6c5; font: 11px/1.55 var(--mono); white-space: nowrap; }
      .warning { border: 1px solid rgba(255,198,109,.24); background: rgba(255,198,109,.07); color: #f3d39f; }
      .failure { border: 1px solid rgba(255,128,119,.24); background: rgba(255,128,119,.07); color: #ffc4be; }

      /* Variant A — a dense, spatial operations console. */
      .a-shell { min-height: 100vh; padding-bottom: 96px; background: radial-gradient(circle at 52% -10%, #203226 0, #0c110e 34%, #090b0a 68%); }
      .a-top { height: 70px; display: flex; align-items: center; gap: 26px; padding: 0 280px 0 26px; border-bottom: 1px solid var(--line); }
      .a-brand { display: flex; align-items: center; gap: 11px; min-width: 205px; }
      .a-mark { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 9px; background: var(--green); color: #0e140a; font-weight: 950; }
      .a-title { font-family: var(--display); font-size: 18px; }
      .a-health { margin-left: auto; display: flex; align-items: center; gap: 18px; }
      .a-layout { display: grid; grid-template-columns: 238px minmax(560px, 1fr) 292px; min-height: calc(100vh - 70px); }
      .a-nav { padding: 22px 14px; border-right: 1px solid var(--line); }
      .a-nav-group { margin-bottom: 26px; }
      .a-nav-label { padding: 0 10px 8px; color: #707870; font: 700 9px/1 var(--mono); letter-spacing: .13em; text-transform: uppercase; }
      .a-nav-item { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 10px; border: 0; border-radius: 9px; background: transparent; cursor: pointer; color: #aeb5ad; text-align: left; font-size: 12px; }
      .a-nav-item.active { color: white; background: rgba(255,255,255,.07); }
      .a-nav-item b { color: #737b73; font: 600 10px/1 var(--mono); }
      .a-main { padding: 30px clamp(20px, 3vw, 44px); min-width: 0; }
      .a-heading { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
      .a-heading h1 { margin: 5px 0 0; font: 400 clamp(28px, 3vw, 40px)/1 var(--display); }
      .a-model-card { display: grid; grid-template-columns: 1fr auto; gap: 18px; padding: 19px; border: 1px solid var(--line); border-radius: 15px; background: rgba(255,255,255,.035); }
      .a-model-title { display: flex; align-items: center; gap: 9px; }
      .a-model-title h2 { margin: 0; font-size: 16px; }
      .a-meta { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
      .a-actions { display: flex; gap: 8px; align-items: start; }
      .a-tabs { display: flex; gap: 22px; margin: 24px 0 14px; border-bottom: 1px solid var(--line); }
      .a-tab { padding: 0 1px 11px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--muted); font-size: 12px; font-weight: 750; }
      .a-tab.active { color: white; border-color: var(--green); }
      .a-profile-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 11px; }
      .a-profile { padding: 16px; border: 1px solid var(--line); border-radius: 13px; background: rgba(15,18,16,.82); cursor: pointer; }
      .a-profile.selected { border-color: rgba(183,243,107,.5); box-shadow: inset 0 0 0 1px rgba(183,243,107,.12); }
      .a-profile h3 { margin: 11px 0 4px; font-size: 14px; }
      .a-statline { display: flex; justify-content: space-between; margin-top: 14px; color: var(--muted); font-size: 10px; }
      .a-workbench { min-width: 0; margin-top: 12px; display: grid; grid-template-columns: 1.12fr .88fr; gap: 11px; }
      .a-box { min-width: 0; padding: 17px; border: 1px solid var(--line); border-radius: 13px; background: rgba(15,18,16,.75); }
      .a-box-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 13px; }
      .a-box-head h3 { margin: 0; font-size: 12px; }
      .a-estimates { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-top: 12px; }
      .a-estimate { padding: 10px; border-radius: 9px; background: rgba(255,255,255,.04); }
      .a-estimate strong { display: block; font: 700 16px/1.2 var(--mono); }
      .a-estimate span { color: var(--muted); font-size: 9px; }
      .a-rail { padding: 23px 18px 100px; border-left: 1px solid var(--line); background: rgba(4,6,5,.34); }
      .a-rail-section { margin-bottom: 25px; }
      .a-rail h3 { margin: 0 0 12px; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; }
      .resource { margin-bottom: 13px; }
      .resource-label { display: flex; justify-content: space-between; margin-bottom: 7px; font: 650 10px/1 var(--mono); }
      .queue-item { padding: 10px 0; border-top: 1px solid var(--line); }
      .queue-item:first-of-type { border-top: 0; }
      .queue-head { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 5px; font-size: 11px; }
      .queue-actions { display: flex; gap: 6px; margin-top: 8px; }
      .a-alert { padding: 12px; border-radius: 10px; font-size: 11px; line-height: 1.45; }

      /* Variant B — a calm, guided model lifecycle. */
      .b-shell { min-height: 100vh; padding: 0 0 110px; background: #f4f0e6; color: #1b211c; --line: rgba(27,33,28,.14); --muted: #667067; }
      .b-top { display: flex; align-items: center; gap: 28px; padding: 24px max(280px, 5vw) 18px 5vw; }
      .b-brand { font: 700 15px/1 var(--mono); }
      .b-run { margin-left: auto; display: flex; align-items: center; gap: 14px; }
      .b-run .status { color: #17714a; }
      .b-intro { padding: 36px 5vw 28px; display: grid; grid-template-columns: 1.1fr .9fr; align-items: end; gap: 50px; }
      .b-intro h1 { margin: 8px 0 0; max-width: 760px; font: 400 clamp(38px, 5vw, 70px)/.96 var(--display); letter-spacing: -.035em; }
      .b-intro p { margin: 0; max-width: 520px; color: #596159; font-size: 14px; line-height: 1.6; }
      .b-flow { margin: 0 5vw; border-top: 1px solid var(--line); }
      .b-steps { display: grid; grid-template-columns: repeat(5, 1fr); }
      .b-step { position: relative; padding: 18px 16px 15px 0; border-bottom: 1px solid var(--line); }
      .b-step::after { content: "→"; position: absolute; right: 16px; top: 20px; color: #a9aea8; }
      .b-step:last-child::after { display: none; }
      .b-step small { display: block; color: #8a918a; font: 700 9px/1 var(--mono); letter-spacing: .11em; }
      .b-step strong { display: block; margin-top: 8px; font-size: 13px; }
      .b-step.active strong { color: #106c42; }
      .b-canvas { margin: 26px 5vw 0; display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(300px, .7fr); gap: 20px; }
      .b-sheet { min-width: 0; padding: 26px; border: 1px solid var(--line); border-radius: 4px; background: #fffdf7; box-shadow: 0 12px 36px rgba(71,60,40,.07); }
      .b-sheet-head { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 26px; }
      .b-sheet h2 { margin: 5px 0 0; font: 400 27px/1.1 var(--display); }
      .b-choice { display: grid; grid-template-columns: 24px 1fr auto; gap: 13px; align-items: start; padding: 16px 0; border-top: 1px solid var(--line); }
      .b-choice input { margin-top: 3px; accent-color: #19734c; }
      .b-choice h3 { margin: 0 0 5px; font-size: 13px; }
      .b-choice p { margin: 0; color: #687068; font-size: 11px; line-height: 1.5; }
      .b-choice .facts { text-align: right; color: #434b44; font: 650 10px/1.55 var(--mono); }
      .b-profile-strip { display: flex; gap: 8px; margin: 15px 0 18px; overflow-x: auto; }
      .b-profile-chip { min-width: 160px; padding: 12px; border: 1px solid var(--line); background: #f9f6ed; text-align: left; cursor: pointer; }
      .b-profile-chip.active { border-color: #19734c; background: #edf7ef; }
      .b-profile-chip strong { display: block; font-size: 11px; }
      .b-profile-chip span { color: #697169; font: 600 9px/1.5 var(--mono); }
      .b-side { display: flex; flex-direction: column; gap: 13px; }
      .b-note { padding: 20px; border: 1px solid var(--line); border-radius: 4px; background: #e9e2d3; }
      .b-note h3 { margin: 0 0 12px; font: 400 20px/1.1 var(--display); }
      .b-note p { color: #62675f; font-size: 11px; line-height: 1.55; }
      .b-proof { padding: 20px; border: 1px solid #b8c9ba; border-radius: 4px; background: #e8f2e7; }
      .b-proof h3 { margin: 0 0 11px; font-size: 12px; }
      .b-proof-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .b-proof-grid strong { display: block; font: 700 16px/1.2 var(--mono); }
      .b-proof-grid span { color: #637064; font-size: 9px; }
      .b-action-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
      .b-action-row .btn { background: #1b211c; color: white; }
      .b-action-row .btn.primary { background: #19734c; border-color: #19734c; color: white; }
      .b-failure { padding: 18px; border: 1px solid #d9a49a; background: #f8e5df; }
      .b-failure h3 { margin: 0 0 7px; font-size: 13px; }
      .b-failure p { margin: 0 0 12px; color: #81574f; font-size: 11px; line-height: 1.5; }
      .b-bottom { margin: 20px 5vw 0; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
      .b-live { padding: 14px 16px; border-top: 2px solid #1b211c; }
      .b-live strong { display: block; font: 700 13px/1.25 var(--mono); }
      .b-live span { color: #687068; font-size: 10px; }

      /* Variant C — an evidence-first, keyboard-minded ledger. */
      .c-shell { min-height: 100vh; padding-bottom: 100px; background: #0a0e16; color: #e4e9f5; --line: rgba(160,176,210,.16); --muted: #8290aa; --green: #69e6c5; }
      .c-top { display: grid; grid-template-columns: 280px 1fr auto; align-items: center; min-height: 64px; padding: 0 280px 0 22px; border-bottom: 1px solid var(--line); background: #0d121d; }
      .c-brand { font: 800 13px/1 var(--mono); letter-spacing: -.02em; }
      .c-search { max-width: 560px; width: 100%; height: 34px; padding: 0 12px; border: 1px solid var(--line); border-radius: 5px; background: #090d15; color: white; font: 11px/1 var(--mono); }
      .c-top-actions { display: flex; gap: 8px; }
      .c-layout { display: grid; grid-template-columns: 220px minmax(760px, 1fr); }
      .c-side { padding: 17px 11px; border-right: 1px solid var(--line); background: #0b1019; }
      .c-side button { width: 100%; display: flex; justify-content: space-between; padding: 9px 10px; border: 0; border-radius: 4px; background: transparent; color: #8d9ab1; text-align: left; cursor: pointer; font: 650 11px/1 var(--mono); }
      .c-side button.active { background: #172033; color: white; }
      .c-side .section { margin: 20px 10px 8px; color: #56647c; font: 700 9px/1 var(--mono); text-transform: uppercase; letter-spacing: .12em; }
      .c-main { min-width: 0; padding: 21px 24px; }
      .c-head { display: flex; align-items: end; justify-content: space-between; margin-bottom: 17px; }
      .c-head h1 { margin: 4px 0 0; font: 700 21px/1.2 var(--mono); }
      .c-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; margin-bottom: 14px; border: 1px solid var(--line); background: var(--line); }
      .c-kpi { padding: 14px; background: #0e1420; }
      .c-kpi small { display: block; color: #71809a; font: 700 9px/1 var(--mono); text-transform: uppercase; }
      .c-kpi strong { display: block; margin-top: 8px; font: 700 19px/1 var(--mono); }
      .c-table-wrap { overflow: hidden; border: 1px solid var(--line); background: #0d131f; }
      .c-table { width: 100%; border-collapse: collapse; font: 10px/1.4 var(--mono); }
      .c-table th { padding: 10px; border-bottom: 1px solid var(--line); background: #111927; color: #70809a; text-align: left; text-transform: uppercase; letter-spacing: .06em; }
      .c-table td { padding: 11px 10px; border-bottom: 1px solid var(--line); color: #b5c1d6; vertical-align: top; }
      .c-table tr:last-child td { border-bottom: 0; }
      .c-table tr.selected td { background: rgba(105,230,197,.045); }
      .c-table strong { color: white; }
      .c-link { border: 0; background: transparent; color: #78b4ff; padding: 0; cursor: pointer; font: inherit; }
      .c-lower { display: grid; grid-template-columns: 1.25fr .75fr; gap: 12px; margin-top: 12px; }
      .c-panel { min-width: 0; border: 1px solid var(--line); background: #0d131f; }
      .c-panel-head { display: flex; align-items: center; justify-content: space-between; padding: 11px 13px; border-bottom: 1px solid var(--line); }
      .c-panel-head h2 { margin: 0; font: 700 11px/1 var(--mono); text-transform: uppercase; }
      .c-panel-body { padding: 13px; }
      .c-command { border-radius: 3px; background: #070a10; color: #9bd8bd; }
      .c-compare { display: grid; grid-template-columns: 120px 1fr 1fr; font: 10px/1.3 var(--mono); }
      .c-compare > div { padding: 8px; border-bottom: 1px solid var(--line); }
      .c-compare .label { color: #65738b; }
      .c-event { display: grid; grid-template-columns: 58px 1fr; gap: 9px; padding: 8px 0; border-bottom: 1px solid var(--line); font: 10px/1.45 var(--mono); }
      .c-event:last-child { border-bottom: 0; }
      .c-event time { color: #65738b; }
      .c-failure { padding: 11px; border-left: 3px solid var(--red); background: rgba(255,128,119,.07); color: #f5b6b0; font: 10px/1.45 var(--mono); }
      .c-action-strip { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px; }
      .c-action-strip .btn { border-radius: 4px; background: #151e2e; font-family: var(--mono); }

      @media (max-width: 1050px) {
        .prototype-flag { display: none; }
        .a-top, .b-top, .c-top { padding-right: 22px; }
        .a-layout { grid-template-columns: 190px 1fr; }
        .a-rail { grid-column: 1 / -1; border: 1px solid var(--line); display: grid; grid-template-columns: repeat(3,1fr); gap: 20px; }
        .b-intro, .b-canvas { grid-template-columns: 1fr; }
        .c-layout { grid-template-columns: 170px minmax(650px, 1fr); overflow-x: auto; }
      }
      @media (max-width: 760px) {
        .prototype-flag { display: none; }
        .switcher { min-width: min(350px, calc(100vw - 24px)); bottom: 12px; }
        .a-layout { display: block; }
        .a-nav { display: none; }
        .a-health > *:not(.status) { display: none; }
        .a-profile-grid, .a-workbench, .a-rail { grid-template-columns: 1fr; }
        .a-rail { display: block; }
        .a-model-card { grid-template-columns: 1fr; }
        .b-steps { grid-template-columns: 1fr; }
        .b-step::after { display: none; }
        .b-intro { padding-top: 20px; }
        .b-bottom { grid-template-columns: 1fr; }
        .c-layout { display: block; min-width: 0; overflow: visible; }
        .c-side { display: none; }
        .c-main { overflow-x: auto; }
        .c-kpis { min-width: 700px; }
        .c-table-wrap, .c-lower { min-width: 850px; }
      }
    </style>
  </head>
  <body>
    <div class="prototype-flag">THROWAWAY PROTOTYPE · LOCAL DATA</div>
    <main id="app"></main>
    <nav class="switcher" aria-label="Prototype variants">
      <button type="button" class="arrow" id="previous" aria-label="Previous variant">←</button>
      <button type="button" class="variant-label" id="variant-label" aria-label="Current variant"></button>
      <button type="button" class="arrow" id="next" aria-label="Next variant">→</button>
    </nav>
    <div class="toast" id="toast" role="status"></div>

    <script>
      const variants = [
        { key: "A", name: "Mission Control", note: "Operate the live system" },
        { key: "B", name: "Guided Workshop", note: "Move one model through its lifecycle" },
        { key: "C", name: "Evidence Ledger", note: "Compare exact facts at high density" },
      ];

      const state = {
        running: true,
        pinned: true,
        shared: true,
        selectedProfile: "Everyday 32k",
        queueCount: 3,
        failedDownload: true,
        testing: false,
      };

      function activeVariant() {
        const key = new URLSearchParams(location.search).get("variant")?.toUpperCase();
        return variants.find((item) => item.key === key) ?? variants[0];
      }

      function setVariant(index) {
        const normalized = (index + variants.length) % variants.length;
        const url = new URL(location.href);
        url.searchParams.set("variant", variants[normalized].key);
        history.replaceState({}, "", url);
        render();
      }

      function toast(message) {
        const element = document.querySelector("#toast");
        element.textContent = message;
        element.classList.add("show");
        clearTimeout(window.toastTimer);
        window.toastTimer = setTimeout(() => element.classList.remove("show"), 2800);
      }

      function renderA() {
        return `
          <section class="a-shell">
            <header class="a-top">
              <div class="a-brand"><span class="a-mark">L</span><span class="a-title">LocalHub</span></div>
              <span class="pill accent">Mac Studio · 64 GB</span>
              <span class="pill">llama.cpp b10107</span>
              <div class="a-health">
                <span class="status ok">Gateway healthy</span>

                    </tbody>
                  </table>
                </div>
                <div class="c-lower">
                  <section class="c-panel"><header class="c-panel-head"><h2>Exact command / Everyday 32k r4</h2><button class="c-link" data-action="copy-command">copy</button></header><div class="c-panel-body"><div class="command c-command">llama-server --model /Volumes/AI/objects/7ac8…/model.gguf --ctx-size 32768 --parallel 2 --batch-size 512 --ubatch-size 128 --kv-unified --n-gpu-layers 999 --fit off --host 127.0.0.1 --port 18321</div><div class="c-action-strip"><button class="btn small" data-action="test-profile">${state.testing ? "TESTING…" : "TEST EXACT REVISION"}</button><button class="btn small" data-action="compare">COMPARE SELECTED</button><button class="btn small ${state.pinned ? "primary" : ""}" data-action="toggle-pin">${state.pinned ? "PINNED" : "PIN"}</button><button class="btn small ${state.shared ? "primary" : ""}" data-action="toggle-share">${state.shared ? "SHARED / FAMILY QWEN" : "SHARE"}</button></div></div></section>
                  <section class="c-panel"><header class="c-panel-head"><h2>Event stream / recovery</h2><span class="status warn">2 need action</span></header><div class="c-panel-body"><div class="c-event"><time>14:42:11</time><span><b class="ok">PROFILE_PASS</b> Everyday 32k r4 · observed ctx 32768 · cancel 0.4s</span></div><div class="c-event"><time>14:39:02</time><span><b class="info">QUEUE</b> Sam's iPhone promoted; ordinary group required next</span></div><div class="c-event"><time>13:05:18</time><span><b class="bad">ACQ_FAIL</b> Llama 3.3 shard 3 digest mismatch</span></div><div class="c-failure">No Installed Model created. Staged bytes isolated.<div class="c-action-strip"><button class="btn small" data-action="retry-download">RETRY SAME SOURCE</button><button class="btn small" data-action="discard-download">DISCARD STAGING</button></div></div></div></section>
                  <section class="c-panel"><header class="c-panel-head"><h2>Profile Result compare</h2><span class="pill">Estimate → observed</span></header><div class="c-panel-body"><div class="c-compare"><div class="label">MEASURE</div><div>EVERYDAY r4</div><div>LONG WORK r2</div><div class="label">context</div><div>32,768 ✓</div><div>98,304 ✓</div><div class="label">peak memory</div><div>36.4 est → 35.8</div><div>49.6 est → 48.1</div><div class="label">generation</div><div>38 est → 41.2 t/s</div><div>27 est → 28.4 t/s</div><div class="label">capabilities</div><div>text ✓ tools ✓</div><div>text ✓ tools —</div></div></div></section>

      function profileRowC(profile, target, context, placement, result, observed, failed = false) {
        return `<tr class="${state.selectedProfile.startsWith(profile.split(" ·")[0]) ? "selected" : ""}"><td><button class="c-link" data-profile="${profile.split(" ·")[0]}"><strong>${profile}</strong></button><br /><span class="muted">template qwen3.5-chat</span></td><td>${target}<br /><span class="muted">b10107 · macOS 15.5</span></td><td>${context}<br /><span class="muted">unified KV</span></td><td>${placement}<br /><span class="muted">fit OFF</span></td><td><span class="status ${failed ? "bad" : "ok"}">${result}</span></td><td>${observed}</td><td><button class="c-link" data-action="${failed ? "edit-copy" : "show-result"}">${failed ? "recover" : "inspect"}</button></td></tr>`;
      }

      function queueLedger(position, member, profile, status) {
        if (Number(position) > state.queueCount) return "";
        return `<div class="c-event"><time>${position}</time><span><strong>${member}</strong> · ${profile} · ${status}<br /><button class="c-link" data-action="run-next">run next</button> / <button class="c-link" data-action="cancel-request">cancel</button></span></div>`;
      }

      function bindActions() {
        document.querySelectorAll("[data-profile]").forEach((element) => {
          element.addEventListener("click", () => {
            state.selectedProfile = element.dataset.profile;
            toast(`Selected exact profile: ${state.selectedProfile}`);
            render();
          });
        });
        document.querySelectorAll("[data-action]").forEach((element) => {
          element.addEventListener("click", () => act(element.dataset.action));
        });
      }

      function act(action) {
        const actions = {
          "toggle-run": () => { state.running = !state.running; toast(state.running ? "Prototype state: LocalHub Run started." : "Prototype state: LocalHub Run stopped explicitly."); },
          "toggle-pin": () => { state.pinned = !state.pinned; toast(state.pinned ? "Pinned: Member requests cannot unload this worker." : "Unpinned: idle capacity may be reclaimed."); },
          "toggle-share": () => { state.shared = !state.shared; toast(state.shared ? "Published exact passing revision as Family Qwen." : "Unshared: no new Member requests admitted."); },
          "test-profile": () => { state.testing = true; toast("Testing exact revision with automatic fitting disabled…"); setTimeout(() => { state.testing = false; render(); toast("Profile Result: passed. Observed facts recorded."); }, 1500); },
          "retry-download": () => { state.failedDownload = false; toast("Retry staged from byte zero against the same exact source."); },
          "discard-download": () => { state.failedDownload = false; toast("Prototype state: incomplete acquisition discarded."); },
          "cancel-request": () => { state.queueCount = Math.max(0, state.queueCount - 1); toast("Waiting request cancelled; queue positions recalculated."); },
          "run-next": () => toast("One Run next promotion recorded; it cannot preempt active work."),
          "copy-command": () => toast("Exact command copied (prototype only)."),
          "compare": () => toast("Compare keeps estimates separate from observed Profile Results."),
          "move-storage": () => toast("Move is blocked until work stops; copy, verify hashes, then switch."),
          "new-acquisition": () => toast("Acquisition requires Host confirmation of exact filenames first."),
          "new-profile": () => toast("New untested revision starts with explicit values; no auto-fit."),
          "edit-copy": () => toast("Creates a new untested revision; the failed result remains intact."),
          "runtime-update": () => toast("Runtime update is explicit and reversible; old result becomes stale."),
          "show-result": () => toast("Full result includes identity, settings, capabilities, timings, and failure detail."),
          "model-menu": () => toast("Rename, reveal files, unshare, unload, move, or remove safely."),
        };
        actions[action]?.();
        if (!["test-profile", "run-next", "copy-command", "compare", "move-storage", "new-acquisition", "new-profile", "edit-copy", "runtime-update", "show-result", "model-menu"].includes(action)) render();
      }

      function render() {
        const variant = activeVariant();
        document.querySelector("#app").innerHTML = variant.key === "A" ? renderA() : variant.key === "B" ? renderB() : renderC();
        document.querySelector("#variant-label").innerHTML = `<strong>${variant.key} — ${variant.name}</strong><small>${variant.note}</small>`;
        document.title = `${variant.key} — ${variant.name} · LocalHub prototype`;
        bindActions();
      }

      document.querySelector("#previous").addEventListener("click", () => setVariant(variants.indexOf(activeVariant()) - 1));
      document.querySelector("#next").addEventListener("click", () => setVariant(variants.indexOf(activeVariant()) + 1));
      document.addEventListener("keydown", (event) => {
        const tag = document.activeElement?.tagName;
        if (["INPUT", "TEXTAREA"].includes(tag) || document.activeElement?.isContentEditable) return;
        if (event.key === "ArrowLeft") setVariant(variants.indexOf(activeVariant()) - 1);
        if (event.key === "ArrowRight") setVariant(variants.indexOf(activeVariant()) + 1);
      });
      window.addEventListener("popstate", render);
      render();
    </script>
  </body>
</html>
