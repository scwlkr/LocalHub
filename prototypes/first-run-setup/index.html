<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocalHub First Run · Throwaway prototype</title>
    <!--
      PROTOTYPE ONLY. Three structurally different First Run and reversible-update
      directions, switchable via ?variant= and ?scenario= on a standalone local route.
    -->
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --ink: #14211d;
        --muted: #65736d;
        --line: #d9e3de;
        --paper: #ffffff;
        --canvas: #eaf0ed;
        --green: #0e7457;
        --green-soft: #dff5ec;
        --cyan: #0ba7b5;
        --cyan-soft: #dff7fa;
        --amber: #a25d00;
        --amber-soft: #fff0d2;
        --red: #a43e39;
        --red-soft: #ffe8e4;
        --blue: #315fbb;
        --blue-soft: #eaf0ff;
        --shadow: 0 24px 70px rgba(20, 40, 32, 0.14);
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: var(--canvas); color: var(--ink); }
      button, input, select { font: inherit; }
      button { cursor: pointer; }
      button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid rgba(11, 167, 181, .35); outline-offset: 2px; }
      #app { min-height: 100vh; padding: 46px 18px 112px; }

      .prototype-flag {
        position: fixed; z-index: 100; top: 10px; left: 50%; transform: translateX(-50%);
        padding: 6px 11px; border: 1px solid rgba(255,255,255,.25); border-radius: 999px;
        background: rgba(16, 28, 23, .88); color: white; backdrop-filter: blur(12px);
        font-size: 10px; font-weight: 850; letter-spacing: .11em; text-transform: uppercase;
      }
      .shell { width: min(1450px, 100%); min-height: 730px; margin: 0 auto; overflow: hidden; background: var(--paper); box-shadow: var(--shadow); }
      .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 900; }
      .brand-mark { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; background: #14211d; color: #74e7ec; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
      .eyebrow { color: var(--muted); font-size: 10px; font-weight: 850; letter-spacing: .12em; text-transform: uppercase; }
      .muted { color: var(--muted); }
      .small { font-size: 12px; line-height: 1.5; }
      .tiny { font-size: 10px; line-height: 1.45; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .row { display: flex; align-items: center; gap: 8px; }
      .spread { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .wrap { flex-wrap: wrap; }
      .stack { display: grid; gap: 10px; }
      .divider { height: 1px; background: var(--line); }

      .pill, .status {
        display: inline-flex; align-items: center; gap: 6px; width: fit-content;
        border: 1px solid var(--line); border-radius: 999px; padding: 5px 9px;
        background: white; color: #40504a; font-size: 10px; font-weight: 800;
      }
      .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #2ea77c; box-shadow: 0 0 0 3px var(--green-soft); }
      .status.warn::before { background: #e19520; box-shadow: 0 0 0 3px var(--amber-soft); }
      .status.bad::before { background: #cb5a54; box-shadow: 0 0 0 3px var(--red-soft); }
      .status.info::before { background: var(--cyan); box-shadow: 0 0 0 3px var(--cyan-soft); }

      .primary, .secondary, .danger, .link-button {
        border-radius: 10px; padding: 10px 14px; border: 1px solid transparent; font-size: 12px; font-weight: 850;
      }
      .primary { background: var(--green); color: white; }
      .secondary { background: white; color: var(--ink); border-color: var(--line); }
      .danger { background: var(--red-soft); color: var(--red); border-color: #efc5bf; }
      .link-button { padding-inline: 4px; background: transparent; color: var(--blue); }
      .card { border: 1px solid var(--line); border-radius: 14px; background: white; padding: 14px; }
      .card h3 { margin: 0 0 5px; font-size: 13px; }
      .card p { margin: 0; }
      .notice { border-left: 3px solid var(--amber); padding: 10px 12px; background: var(--amber-soft); color: #684615; font-size: 11px; line-height: 1.5; }
      .danger-note { border-left-color: var(--red); background: var(--red-soft); color: #713b36; }
      .good-note { border-left-color: var(--green); background: var(--green-soft); color: #275e4c; }
      .choice {
        display: grid; grid-template-columns: 18px 1fr; gap: 10px; align-items: start;
        width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: white; text-align: left;
      }
      .choice.selected { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
      .choice-dot { width: 16px; height: 16px; margin-top: 2px; border: 1px solid #9cafa6; border-radius: 50%; background: white; }
      .choice.selected .choice-dot { border: 5px solid var(--green); }
      .progress { height: 7px; overflow: hidden; border-radius: 999px; background: #dce7e1; }
      .progress span { display: block; width: var(--fill, 58%); height: 100%; border-radius: inherit; background: var(--green); }
      .metric { display: grid; gap: 4px; }
      .metric strong { font-size: 12px; }

      .qr {
        display: grid; grid-template-columns: repeat(9, 5px); grid-template-rows: repeat(9, 5px); gap: 1px;
        width: fit-content; padding: 7px; border: 1px solid var(--line); border-radius: 8px; background: white;
      }
      .qr i { width: 5px; height: 5px; background: transparent; }
      .qr i.on { background: #14211d; }
      .member-link { border: 1px solid #b8d8ce; border-radius: 11px; padding: 10px; background: #f2fbf7; }
      .receipt-row { display: grid; grid-template-columns: 160px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
      .receipt-row:last-child { border: 0; }

      /* Variant A — a quiet, one-decision-at-a-time runway. */
      .variant-a.shell { display: grid; grid-template-columns: 250px minmax(520px, 1fr) 310px; border-radius: 24px; }
      .variant-a .rail { padding: 24px 18px; background: #14211d; color: #e9f4ef; }
      .variant-a .rail .eyebrow, .variant-a .rail .muted { color: #92aaa0; }
      .variant-a .steps { display: grid; gap: 4px; margin-top: 28px; }
      .variant-a .step {
        display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: center;
        border: 0; border-radius: 11px; padding: 8px; background: transparent; color: #92aaa0; text-align: left; font-size: 11px;
      }
      .variant-a .step-number { display: grid; place-items: center; width: 26px; height: 26px; border: 1px solid #41564d; border-radius: 50%; font-size: 10px; font-weight: 900; }
      .variant-a .step.active { background: #22352e; color: white; }
      .variant-a .step.active .step-number { border-color: #74e7ec; color: #74e7ec; }
      .variant-a .step.done .step-number { border-color: #51c598; background: #1d5e49; color: white; }
      .variant-a .center { display: grid; grid-template-rows: auto 1fr auto; min-width: 0; padding: 28px 34px 22px; }
      .variant-a .center h1 { max-width: 700px; margin: 18px 0 8px; font-size: clamp(26px, 3vw, 42px); line-height: 1.04; letter-spacing: -.035em; }
      .variant-a .content { display: grid; align-content: start; gap: 14px; margin-top: 22px; }
      .variant-a .aside { padding: 24px 20px; border-left: 1px solid var(--line); background: #f6f9f7; }
      .variant-a .aside h2 { margin: 5px 0 16px; font-size: 16px; }
      .variant-a .footer { padding-top: 18px; border-top: 1px solid var(--line); }

      /* Variant B — a readiness board with required and optional lanes. */
      .variant-b.shell { border-radius: 16px; background: #f3f7f5; }
      .variant-b .topbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); background: white; }
      .variant-b .board-head { padding: 28px 30px 12px; }
      .variant-b .board-head h1 { margin: 7px 0; font-size: 30px; letter-spacing: -.03em; }
      .variant-b .board { display: grid; grid-template-columns: 1.15fr .9fr .9fr; gap: 14px; padding: 14px 30px 30px; }
      .variant-b .lane { min-width: 0; border: 1px solid var(--line); border-radius: 15px; padding: 14px; background: rgba(255,255,255,.68); }
      .variant-b .lane-head { display: flex; justify-content: space-between; align-items: start; gap: 10px; margin-bottom: 12px; }
      .variant-b .lane h2 { margin: 0; font-size: 14px; }
      .variant-b .check-card { display: grid; grid-template-columns: 30px 1fr; gap: 10px; margin-top: 9px; border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: white; }
      .variant-b .check-icon { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 9px; background: var(--green-soft); color: var(--green); font-weight: 950; }
      .variant-b .check-card.warn .check-icon { background: var(--amber-soft); color: var(--amber); }
      .variant-b .check-card.bad .check-icon { background: var(--red-soft); color: var(--red); }
      .variant-b .check-card.info .check-icon { background: var(--cyan-soft); color: #08717c; }
      .variant-b .bottom-run { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 0 30px 30px; border: 1px solid #bad7cd; border-radius: 14px; padding: 14px 16px; background: #eefbf6; }

      /* Variant C — a route map and immutable setup receipt. */
      .variant-c.shell { display: grid; grid-template-columns: minmax(560px, 1.25fr) minmax(360px, .75fr); border-radius: 5px; background: #fbf8ef; }
      .variant-c .map { min-width: 0; padding: 26px 30px 30px; border-right: 1px solid #d9cfb9; background-image: linear-gradient(rgba(190,177,148,.16) 1px, transparent 1px), linear-gradient(90deg, rgba(190,177,148,.11) 1px, transparent 1px); background-size: 32px 32px; }
      .variant-c .map-head { display: flex; align-items: start; justify-content: space-between; gap: 14px; }
      .variant-c .map h1 { margin: 16px 0 6px; font-family: Georgia, serif; font-size: 36px; font-weight: 500; letter-spacing: -.02em; }
      .variant-c .route { position: relative; display: grid; gap: 18px; margin-top: 26px; padding-left: 24px; }
      .variant-c .route::before { content: ""; position: absolute; left: 11px; top: 19px; bottom: 19px; width: 2px; background: #b6c9bd; }
      .variant-c .stop { position: relative; display: grid; grid-template-columns: 1fr auto; gap: 14px; border: 1px solid #d9cfb9; border-radius: 3px; padding: 14px 15px; background: rgba(255,253,247,.94); }
      .variant-c .stop::before { content: ""; position: absolute; left: -20px; top: 18px; width: 12px; height: 12px; border: 3px solid #fbf8ef; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 1px #8baa9b; }
      .variant-c .stop.warn::before { background: #e0a038; }
      .variant-c .stop h2 { margin: 0 0 4px; font-family: Georgia, serif; font-size: 16px; font-weight: 600; }
      .variant-c .ledger { padding: 26px 24px; background: #efe8d8; }
      .variant-c .ledger h2 { margin: 8px 0 4px; font-family: Georgia, serif; font-size: 21px; }
      .variant-c .receipt { margin-top: 18px; border: 1px solid #cfc2a6; padding: 14px; background: #fffdf7; box-shadow: 4px 4px 0 rgba(155,137,101,.14); }
      .variant-c .receipt-row { grid-template-columns: 126px 1fr; font-size: 11px; }
      .variant-c .stamp { display: inline-block; transform: rotate(-2deg); border: 2px solid var(--green); border-radius: 4px; padding: 5px 8px; color: var(--green); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }

      .prototype-controls {
        position: fixed; z-index: 110; left: 50%; bottom: 16px; transform: translateX(-50%);
        display: flex; align-items: center; gap: 8px; max-width: calc(100vw - 18px); overflow-x: auto;
        padding: 8px; border: 1px solid rgba(255,255,255,.18); border-radius: 15px;
        background: rgba(16, 27, 23, .94); color: white; box-shadow: 0 18px 50px rgba(0,0,0,.28); backdrop-filter: blur(15px);
      }
      .prototype-controls .group { display: flex; flex: 0 0 auto; gap: 4px; }
      .prototype-controls button, .prototype-controls select {
        border: 1px solid #40534a; border-radius: 9px; padding: 7px 10px; background: #22322b; color: #dcebe4; font-size: 10px; font-weight: 850;
      }
      .prototype-controls button.active { border-color: #74e7ec; background: #225f4a; color: white; }
      .control-label { padding-left: 4px; color: #91a79d; font-size: 9px; font-weight: 850; letter-spacing: .1em; text-transform: uppercase; }

      @media (max-width: 1050px) {
        .variant-a.shell { grid-template-columns: 205px minmax(430px, 1fr); }
        .variant-a .aside { grid-column: 1 / -1; border-top: 1px solid var(--line); border-left: 0; }
        .variant-b .board { grid-template-columns: 1fr 1fr; }
        .variant-b .lane:first-child { grid-row: span 2; }
        .variant-c.shell { grid-template-columns: 1fr; }
        .variant-c .map { border-right: 0; border-bottom: 1px solid #d9cfb9; }
      }

      @media (max-width: 720px) {
        #app { padding: 38px 7px 106px; }
        .shell { min-height: auto; }
        .prototype-flag { top: 6px; white-space: nowrap; }
        .variant-a.shell { display: block; border-radius: 14px; }
        .variant-a .rail { padding: 14px; }
        .variant-a .steps { display: flex; overflow-x: auto; margin-top: 14px; }
        .variant-a .step { flex: 0 0 auto; }
        .variant-a .center { padding: 22px 18px 18px; }
        .variant-a .center h1 { font-size: 30px; }
        .variant-b .topbar { grid-template-columns: 1fr auto; }
        .variant-b .topbar > :nth-child(2) { display: none; }
        .variant-b .board-head { padding: 22px 15px 8px; }
        .variant-b .board { grid-template-columns: 1fr; padding: 10px 15px 20px; }
        .variant-b .bottom-run { align-items: start; flex-direction: column; margin: 0 15px 20px; }
        .variant-c .map, .variant-c .ledger { padding: 20px 16px; }
        .variant-c .map h1 { font-size: 30px; }
        .receipt-row { grid-template-columns: 1fr; gap: 3px; }
      }
    </style>
  </head>
  <body>
    <div class="prototype-flag">Throwaway prototype · no real system changes</div>
    <main id="app"></main>
    <nav class="prototype-controls" aria-label="Prototype controls">
      <span class="control-label">Direction</span>
      <div class="group">
        <button type="button" data-variant="A">←</button>
        <button type="button" data-variant="A">A · Runway</button>
        <button type="button" data-variant="B">B · Board</button>
        <button type="button" data-variant="C">C · Route map</button>
        <button type="button" data-variant="C">→</button>
      </div>
      <span class="control-label">Moment</span>
      <select id="scenario" aria-label="Prototype moment">
        <option value="setup">First Run</option>
        <option value="search">Web Search</option>
        <option value="ready">Run ready</option>
        <option value="failure">Fix a failure</option>
        <option value="update">Update & rollback</option>
        <option value="uninstall">Stop & uninstall</option>
      </select>
    </nav>

    <script>
      const params = new URLSearchParams(window.location.search);
      const variants = {
        A: { name: "Guided Runway" },
        B: { name: "Readiness Board" },
        C: { name: "Route Map & Receipt" },
      };
      const scenarios = ["setup", "search", "ready", "failure", "update", "uninstall"];
      const state = {
        variant: variants[params.get("variant")] ? params.get("variant") : "A",
        scenario: scenarios.includes(params.get("scenario")) ? params.get("scenario") : "setup",
        storage: "/Users/shane/LocalHub Models",
        searchEnabled: true,
        running: true,
      };

      const setupSteps = [
        ["Welcome", "Know what LocalHub changes"],
        ["Host check", "Apple Silicon and free space"],
        ["Model Storage", "Choose a managed location"],
        ["Inference", "Verify pinned llama.cpp"],
        ["Members", "Test the LAN and Member Link"],
        ["Web Search", "Optional Host-supplied Docker"],
        ["Start Run", "Review and start explicitly"],
        ["Ready", "Open the Host dashboard"],
      ];

      function updateUrl() {
        const next = new URLSearchParams({ variant: state.variant, scenario: state.scenario });
        history.replaceState({}, "", `${location.pathname}?${next}`);
      }

      function qr() {
        const bits = "111011111010101011101110101010001011111010111010000101101110111011101010111110101";
        return `<div class="qr" aria-label="Prototype QR code">${bits.split("").map((bit) => `<i class="${bit === "1" ? "on" : ""}"></i>`).join("")}</div>`;
      }

      function storageCard() {
        return `<div class="stack">
          <button class="choice selected" type="button" data-action="storage-default">
            <span class="choice-dot"></span><span><strong>Use the recommended folder</strong><span class="small muted" style="display:block">${state.storage} · 412 GB free · LocalHub manages only this folder</span></span>
          </button>
          <button class="choice" type="button" data-action="storage-other">
            <span class="choice-dot"></span><span><strong>Choose another folder or drive</strong><span class="small muted" style="display:block">The drive must stay connected while its models are available.</span></span>
          </button>
          <div class="notice">LocalHub will stage and verify model files here. It never changes your original files outside Model Storage.</div>
        </div>`;
      }

      function dockerDetails(compact = false) {
        return `<div class="stack">
          <div class="spread wrap"><span class="status info">Host runtime found</span><span class="pill mono">docker compose v2.39</span></div>
          <div class="notice"><strong>Enable Web Search?</strong><br>LocalHub will not install Docker, create an account, start a trial, or purchase anything. Docker Desktop is free only for eligible use. You confirm your use is allowed at $0 under the current terms.</div>
          ${compact ? "" : `<div class="card stack">
            <div class="spread"><strong class="small">Exact SearXNG image</strong><span class="pill">90.1 MiB download</span></div>
            <span class="tiny mono muted">searxng/searxng:2026.5.31-7159b8aed<br>arm64 digest · 6b5787…e006a</span>
            <div class="progress" style="--fill:68%"><span></span></div>
            <div class="spread tiny muted"><span>64.0 MiB of 90.1 MiB</span><span>Secret created locally · finite health check next</span></div>
          </div>`}
          <div class="row wrap">
            <button class="primary" type="button" data-action="enable-search">I confirm — Enable Web Search</button>
            <button class="secondary" type="button" data-action="skip-search">Skip Web Search</button>
          </div>
          <span class="tiny muted">Absent runtime, no confirmation, failed pull, or failed health check leaves Web Search disabled. No fallback provider.</span>
        </div>`;
      }

      function readyCard() {
        return `<div class="stack">
          <div class="card good-note">
            <div class="spread wrap"><strong>LocalHub Run is active</strong><span class="status">Host control · loopback only</span></div>
            <p class="small" style="margin-top:8px">Closing this window will not stop LocalHub. Use <strong>Stop LocalHub</strong> when you want the Run to end.</p>
          </div>
          <div class="member-link spread wrap">
            <div class="stack" style="gap:4px"><span class="eyebrow">Member Link</span><strong class="mono">http://localhub-shane.local:4317</strong><span class="tiny muted">Fallback · http://192.168.1.42:4317</span><button class="link-button" type="button">Copy Member Link</button></div>${qr()}
          </div>
          <div class="notice">No Shared Model yet. The Run works, but Members cannot submit requests until you acquire, test, and share an exact model profile.</div>
        </div>`;
      }

      function failureCard() {
        return `<div class="stack">
          <div class="card" style="border-color:#efc5bf">
            <div class="spread wrap"><span class="status bad">Member Link unreachable</span><span class="pill">Required fix</span></div>
            <h3 style="margin-top:12px">macOS firewall denied incoming connections</h3>
            <p class="small muted">Host control still works on this Mac. Members cannot connect; LocalHub did not switch interfaces or expose another port.</p>
          </div>
          <div class="card stack"><strong class="small">Fix it, then recheck</strong><span class="small">1. Open System Settings → Network → Firewall → Options.<br>2. Allow incoming connections for LocalHub.<br>3. Return here and test from the shown phone.</span><div class="row wrap"><button class="primary" type="button" data-action="recheck">Recheck Member Link</button><button class="secondary" type="button">Open Firewall Settings</button></div></div>
          <div class="notice danger-note">LocalHub will not disable the firewall, silently bind another interface, or call this healthy until a physical Member device connects.</div>
        </div>`;
      }

      function updateCard() {
        return `<div class="stack">
          <div class="spread wrap"><div><span class="eyebrow">Update available</span><h2 style="margin:5px 0">LocalHub 1.1.0</h2></div><span class="status info">Apple-notarized · checksum verified</span></div>
          <div class="card stack">
            <div class="receipt-row"><strong class="small">Changes</strong><span class="small">LocalHub runtime, llama.cpp b10148, SearXNG image and configuration</span><span class="pill">148 MiB + 92 MiB</span></div>
            <div class="receipt-row"><strong class="small">Before upgrade</strong><span class="small">Stop new work, wait or cancel active requests, verify free space</span><span class="status">Ready</span></div>
            <div class="receipt-row"><strong class="small">Rollback kept</strong><span class="small">LocalHub 1.0.0 + llama.cpp b10107 + prior SearXNG image/config/state</span><span class="pill">Complete pair</span></div>
          </div>
          <div class="notice">LocalHub never auto-updates. The new release activates only after manifest, signature, architecture, health, and state checks. A failed check restores the complete previous runtime/state pair.</div>
          <div class="row wrap"><button class="primary" type="button" data-action="approve-update">Approve, stop Run & update</button><button class="secondary" type="button">Not now</button><button class="danger" type="button" data-action="rollback">Roll back to 1.0.0</button></div>
        </div>`;
      }

      function uninstallCard() {
        return `<div class="stack">
          <div class="card"><div class="spread wrap"><div><span class="eyebrow">Current lifecycle</span><h3 style="margin-top:5px">LocalHub Run is active</h3></div><button class="danger" type="button" data-action="stop">Stop LocalHub</button></div><p class="small muted" style="margin-top:8px">Stopping rejects new work, finishes or explicitly cancels active work, closes the Member Link, and stops the SearXNG container. It does not uninstall or delete models.</p></div>
          <div class="card stack"><div class="spread wrap"><strong class="small">Uninstall LocalHub</strong><span class="pill">Separate from stop</span></div><div class="choice selected"><span class="choice-dot"></span><span><strong>Keep Model Storage</strong><span class="small muted" style="display:block">Keep 286 GB of verified models for reinstall or manual recovery.</span></span></div><div class="choice"><span class="choice-dot"></span><span><strong>Move managed models to Trash</strong><span class="small muted" style="display:block">Name exact files and size again before the recoverable move.</span></span></div><p class="tiny muted">Uninstall removes the active LocalHub runtime, LaunchAgent, configuration, generated SearXNG secret, and LocalHub-owned container/config after explicit confirmation. It never deletes Docker itself or original source files.</p><button class="danger" type="button">Review exact removal list</button></div>
        </div>`;
      }

      function scenarioContent() {
        if (state.scenario === "search") return dockerDetails();
        if (state.scenario === "ready") return readyCard();
        if (state.scenario === "failure") return failureCard();
        if (state.scenario === "update") return updateCard();
        if (state.scenario === "uninstall") return uninstallCard();
        return storageCard();
      }

      function scenarioMeta() {
        return {
          setup: ["Choose Model Storage", "One managed home for exact, verified model files.", 3],
          search: ["Decide on Web Search", "Optional and permanently zero-spend; LocalHub continues without it.", 6],
          ready: ["Your Run is ready", "Host control is local; the Member Link is on one selected private interface.", 8],
          failure: ["One fix before Members can connect", "The working Host surface stays available while the failed boundary stays closed.", 5],
          update: ["Review a reversible update", "Nothing changes until the Host approves the exact whole-release move.", 0],
          uninstall: ["Stop is not uninstall", "Choose exactly what ends and what remains recoverable.", 0],
        }[state.scenario];
      }

      function renderA() {
        const [title, subtitle, active] = scenarioMeta();
        const lifecycle = active === 0;
        return `<section class="variant-a shell">
          <aside class="rail">
            <div class="brand"><span class="brand-mark">$ lh</span><span>LocalHub</span></div>
            <div class="steps">
              ${lifecycle ? `<div class="step active"><span class="step-number">↺</span><span>Lifecycle<br><span class="tiny">After First Run</span></span></div>` : setupSteps.map(([name, detail], index) => `<button class="step ${index + 1 === active ? "active" : index + 1 < active ? "done" : ""}" type="button" data-step="${index + 1}"><span class="step-number">${index + 1 < active ? "✓" : index + 1}</span><span>${name}<br><span class="tiny">${detail}</span></span></button>`).join("")}
            </div>
            <div class="tiny muted" style="margin-top:26px">You can leave before Start Run. Completed checks are saved locally; no background install continues.</div>
          </aside>
          <div class="center">
            <header class="spread wrap"><span class="status info">Prototype · read only</span><button class="link-button" type="button">Quit setup</button></header>
            <div>
              <span class="eyebrow">${lifecycle ? "Settings · LocalHub lifecycle" : `First Run · step ${active} of 8`}</span>
              <h1>${title}</h1><p class="muted small">${subtitle}</p>
              <div class="content">${scenarioContent()}</div>
            </div>
            <footer class="footer spread wrap"><button class="secondary" type="button">Back</button><div class="row"><span class="tiny muted">No hidden next step</span><button class="primary" type="button">${state.scenario === "setup" ? "Use this folder" : state.scenario === "ready" ? "Open Host dashboard" : "Continue"}</button></div></footer>
          </div>
          <aside class="aside">
            <span class="eyebrow">What changes now</span><h2>${state.scenario === "setup" ? "Only one folder is selected" : state.scenario === "search" ? "One optional local service" : state.scenario === "update" ? "One complete release pair" : "The exact state shown"}</h2>
            <div class="stack">
              <div class="card"><h3>Local changes</h3><p class="small muted">${state.scenario === "setup" ? "Create LocalHub-owned staging and catalog folders only after confirmation." : state.scenario === "update" ? "Retain the current runtime/state pair until the new pair proves healthy." : "Every action names what starts, stops, or remains."}</p></div>
              <div class="card"><h3>Never automatic</h3><p class="small muted">No model choice, source substitution, paid service, background update, firewall bypass, or permanent deletion.</p></div>
              <div class="card"><h3>Need help?</h3><p class="small muted">Show the failed check, plain-language cause, protected state, and one exact fix.</p></div>
            </div>
          </aside>
        </section>`;
      }

      function boardCards() {
        const scenario = state.scenario;
        return {
          required: [
            ["✓", "Apple Silicon Host", "32 GB memory · supported macOS", ""],
            [scenario === "failure" ? "!" : "✓", "Member network", scenario === "failure" ? "Firewall denied the physical-device check" : "en0 · private LAN · physical phone passed", scenario === "failure" ? "bad" : ""],
            ["✓", "Model Storage", `${state.storage} · 412 GB free`, ""],
            ["✓", "llama.cpp b10107", "Pinned binary, Metal devices, load/stop probe passed", ""],
          ],
          optional: [
            [state.searchEnabled ? "✓" : "–", "Web Search", state.searchEnabled ? "Host eligibility confirmed · exact image healthy" : "Skipped · no fallback provider", state.searchEnabled ? "" : "warn"],
            ["○", "First Shared Model", "After First Run: acquire, test, then share", "info"],
          ],
          lifecycle: [
            [state.running ? "●" : "○", "LocalHub Run", state.running ? "Active until explicit Stop" : "Stopped · Member Link closed", "info"],
            [state.scenario === "update" ? "!" : "○", "Update", state.scenario === "update" ? "1.1.0 ready for Host review" : "No automatic update", state.scenario === "update" ? "warn" : ""],
            ["↺", "Rollback", "Complete 1.0.0 runtime/state pair retained", ""],
            ["⌫", "Uninstall", "Separate review; keep models by default", ""],
          ],
        };
      }

      function renderCheckCard(item) {
        const [icon, name, detail, tone] = item;
        return `<div class="check-card ${tone}"><span class="check-icon">${icon}</span><div><strong class="small">${name}</strong><div class="tiny muted">${detail}</div></div></div>`;
      }

      function renderB() {
        const cards = boardCards();
        return `<section class="variant-b shell">
          <header class="topbar"><div class="brand"><span class="brand-mark">$ lh</span><span>LocalHub</span></div><span class="eyebrow">First Run readiness</span><div class="row" style="justify-self:end"><span class="pill">No changes without approval</span></div></header>
          <div class="board-head spread wrap"><div><span class="eyebrow">One board · every gate visible</span><h1>${state.scenario === "ready" ? "This Host is ready to start" : state.scenario === "failure" ? "Host ready; Member access needs one fix" : "Prepare the first LocalHub Run"}</h1><p class="small muted">Required checks block their affected boundary. Optional services never block the Run. Lifecycle actions stay visible after setup.</p></div><div class="row wrap"><button class="secondary" type="button">Run all checks again</button><button class="primary" type="button">Review & Start Run</button></div></div>
          <div class="board">
            <section class="lane"><div class="lane-head"><div><span class="eyebrow">Required</span><h2>Start Run gates</h2></div><span class="status ${state.scenario === "failure" ? "warn" : ""}">${state.scenario === "failure" ? "3" : "4"} of 4</span></div>${cards.required.map(renderCheckCard).join("")}</section>
            <section class="lane"><div class="lane-head"><div><span class="eyebrow">Optional</span><h2>Useful after start</h2></div><span class="pill">Never blocks</span></div>${cards.optional.map(renderCheckCard).join("")}${state.scenario === "search" ? `<div style="margin-top:10px">${dockerDetails(true)}</div>` : ""}</section>
            <section class="lane"><div class="lane-head"><div><span class="eyebrow">Reversible</span><h2>Run & release lifecycle</h2></div><span class="pill">Host-controlled</span></div>${cards.lifecycle.map(renderCheckCard).join("")}${state.scenario === "update" ? `<button class="primary" type="button" style="width:100%;margin-top:10px">Review update pair</button>` : ""}</section>
          </div>
          <div class="bottom-run"><div><strong class="small">${state.scenario === "failure" ? "Start Run stays available for Host-only use" : "Ready to start without a model"}</strong><div class="tiny muted">First Run starts LocalHub and opens the dashboard. Model acquisition, exact Profile Tests, and sharing happen next.</div></div><div class="row wrap"><span class="status ${state.scenario === "failure" ? "warn" : ""}">${state.scenario === "failure" ? "Member access closed" : "All required gates pass"}</span><button class="primary" type="button">Start LocalHub</button></div></div>
        </section>`;
      }

      function routeStops() {
        const scenario = state.scenario;
        return [
          ["1", "Trust this release", "Apple-notarized and checksum verified; honest unnotarized wording if fallback applies.", "Verified"],
          ["2", "Prepare the Host", "Apple Silicon, supported macOS, free space, firewall and sleep risks shown.", "Passed"],
          ["3", "Choose Model Storage", `${state.storage}; staged bytes cannot run before verification.`, "Chosen"],
          ["4", "Verify native inference", "Pinned llama.cpp b10107; loopback worker and Metal check; automatic fitting disabled.", "Passed"],
          ["5", "Open one Member gateway", scenario === "failure" ? "Selected interface is protected; firewall fix required before LAN access." : "Friendly .local link plus IP and QR fallback; Host controls never exposed on LAN.", scenario === "failure" ? "Fix needed" : "Passed"],
          ["6", "Choose optional Web Search", state.searchEnabled ? "Host-supplied Docker confirmed at $0; exact SearXNG image healthy." : "Skipped; LocalHub continues with no search fallback.", state.searchEnabled ? "Enabled" : "Skipped"],
          ["7", "Start the Run", "An explicit Host action starts LocalHub; closing a window does not stop it.", state.running ? "Active" : "Stopped"],
        ];
      }

      function renderC() {
        const [title] = scenarioMeta();
        const stops = routeStops();
        return `<section class="variant-c shell">
          <div class="map">
            <div class="map-head"><div class="brand"><span class="brand-mark">$ lh</span><span>LocalHub</span></div><span class="stamp">Prototype route · ${state.scenario}</span></div>
            <h1>${state.scenario === "update" ? "Change the whole release, or change nothing." : state.scenario === "uninstall" ? "End the Run. Keep what matters." : title}</h1>
            <p class="small muted">Follow the route once. Keep the receipt for every later diagnosis, update, rollback, and removal.</p>
            <div class="route">${stops.map(([num, name, detail, status]) => `<div class="stop ${status === "Fix needed" ? "warn" : ""}"><div><span class="eyebrow">Stop ${num}</span><h2>${name}</h2><p class="small muted" style="margin:0">${detail}</p></div><span class="status ${status === "Fix needed" ? "bad" : status === "Skipped" ? "warn" : ""}">${status}</span></div>`).join("")}</div>
          </div>
          <aside class="ledger">
            <span class="eyebrow">Host receipt · local only</span><h2>${state.scenario === "update" ? "Release change order" : state.scenario === "uninstall" ? "Removal manifest" : "What this Run trusts"}</h2>
            <p class="small muted">Exact identity and recovery facts stay readable after the guided route is gone.</p>
            <div class="receipt">
              <div class="receipt-row"><strong>LocalHub</strong><span class="mono">1.0.0 · Apple-notarized</span></div>
              <div class="receipt-row"><strong>Inference</strong><span class="mono">llama.cpp b10107 · arm64</span></div>
              <div class="receipt-row"><strong>Model Storage</strong><span class="mono">${state.storage}</span></div>
              <div class="receipt-row"><strong>Member gateway</strong><span>en0 · .local + IPv4 fallback</span></div>
              <div class="receipt-row"><strong>Web Search</strong><span>${state.searchEnabled ? "Exact SearXNG arm64 digest · loopback healthy" : "Disabled · no fallback"}</span></div>
              <div class="receipt-row"><strong>Rollback</strong><span>Previous complete runtime/state pair retained</span></div>
            </div>
            <div class="stack" style="margin-top:16px">${state.scenario === "update" ? updateCard() : state.scenario === "uninstall" ? uninstallCard() : state.scenario === "ready" ? readyCard() : state.scenario === "search" ? dockerDetails(true) : state.scenario === "failure" ? failureCard() : `<div class="notice good-note">The receipt is evidence, not a promise. Each failed check stays failed until its exact recheck passes.</div><button class="primary" type="button">Continue route</button>`}</div>
          </aside>
        </section>`;
      }

      function render() {
        updateUrl();
        document.querySelector("#app").innerHTML = state.variant === "A" ? renderA() : state.variant === "B" ? renderB() : renderC();
        document.querySelector("#scenario").value = state.scenario;
        document.querySelectorAll("[data-variant]").forEach((button) => {
          button.classList.toggle("active", button.dataset.variant === state.variant);
        });
        document.title = `${state.variant} — ${variants[state.variant].name} · LocalHub prototype`;
      }

      document.addEventListener("click", (event) => {
        const variant = event.target.closest("[data-variant]")?.dataset.variant;
        if (variant) {
          const controlText = event.target.textContent.trim();
          if (controlText === "←" || controlText === "→") {
            const keys = Object.keys(variants);
            const offset = controlText === "←" ? -1 : 1;
            state.variant = keys[(keys.indexOf(state.variant) + offset + keys.length) % keys.length];
          } else state.variant = variant;
          render();
        }
        const action = event.target.closest("[data-action]")?.dataset.action;
        if (action === "skip-search") { state.searchEnabled = false; render(); }
        if (action === "enable-search") { state.searchEnabled = true; render(); }
        if (action === "stop") { state.running = false; render(); }
      });
      document.querySelector("#scenario").addEventListener("change", (event) => { state.scenario = event.target.value; render(); });
      document.addEventListener("keydown", (event) => {
        if (!["ArrowLeft", "ArrowRight"].includes(event.key)) return;
        if (event.target.matches("input, textarea, select, [contenteditable]")) return;
        const keys = Object.keys(variants);
        const offset = event.key === "ArrowLeft" ? -1 : 1;
        state.variant = keys[(keys.indexOf(state.variant) + offset + keys.length) % keys.length];
        render();
      });
      window.addEventListener("popstate", render);
      render();
    </script>
  </body>
</html>
